# PLAN P1.8 · D§2. Preview versions on every PR; production only by hand.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the
# preview job is skipped (no external calls, no cost).
name: Deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to deploy main to production'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PNPM_VERSION: 12.16.1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'production')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # SPEC §14 Q1: domain undecided; canonical/OG URLs use this until it is set.
      SITE_URL: ${{ vars.SITE_URL || 'https://tolle.workers.dev' }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24

      - name: Build
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload preview version
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        working-directory: apps/worker
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec wrangler versions upload --preview-alias "pr-${PR_NUMBER}"

      - name: Deploy production
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
